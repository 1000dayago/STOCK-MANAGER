name: 자료 수집

# 평일 저녁 7시(한국시간)에 공시·뉴스·재무·일봉 시세를 받아 data/ 폴더에 저장합니다.
# 직접 실행: 저장소의 Actions 탭 > "자료 수집" > Run workflow
on:
  schedule:
    - cron: '0 10 * * 1-5'
  workflow_dispatch:
    inputs:
      only:
        description: '일부만 실행 (prices, news, dart, fin 중 쉼표로 구분, 비우면 전부)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 자료 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          COLLECT_ONLY: ${{ github.event.inputs.only }}
        run: node tools/collect.js
      - name: 변경 사항 저장
        if: always()
        run: |
          git config user.name "자료 수집 봇"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "변경 사항 없음"
          else
            git commit -m "자료 수집 $(date -u +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
