name: 종목 목록 갱신

# 앱의 종목 입력창이 이름·코드를 검색할 때 쓰는 전체 종목 목록(data/stocks.json)을 네이버 증권에서 받아 갱신합니다.
# 매주 일요일에 실행하고, 신규 상장 종목이 급할 때는 Actions 탭 > "종목 목록 갱신" > Run workflow 로 직접 실행하세요.
# 내용이 그대로면 커밋하지 않습니다. 받은 종목이 너무 적으면(3,000개 미만) 기존 파일을 그대로 두고 실패로 끝납니다.
on:
  schedule:
    - cron: '17 9 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stocklist
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 종목 목록 만들기
        run: node tools/build-stocklist.js
      - name: 변경 사항 저장
        if: success()
        run: |
          git config user.name "자료 수집 봇"
          git config user.email "actions@users.noreply.github.com"
          git add data/stocks.json
          if git diff --cached --quiet; then
            echo "변경 사항 없음"
          else
            git commit -m "종목 목록 갱신 $(date -u +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
