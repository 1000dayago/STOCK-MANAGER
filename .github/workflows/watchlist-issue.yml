name: 수집 대상 반영

# 앱의 “수집 대상 반영” 버튼이 여는 이슈를 제출하면, 이 작업이 data/watchlist.json 을 갱신하고
# “자료 수집”을 바로 실행한 뒤 결과를 이슈에 댓글로 남기고 이슈를 닫습니다.
# 저장소 소유자가 연 이슈만 처리합니다. 이슈 본문은 신뢰하지 않는 입력으로 다루며(환경 변수로만 전달),
# tools/watchlist-issue.js 가 종목코드 6자리·이름·기간만 받아들입니다.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: watchlist-issue
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '수집 대상 반영')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 목록 검증·반영
        id: apply
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node tools/watchlist-issue.js
      - name: 변경 사항 저장
        if: steps.apply.outputs.ok == 'true'
        run: |
          git config user.name "자료 수집 봇"
          git config user.email "actions@users.noreply.github.com"
          git add data/watchlist.json
          if git diff --cached --quiet; then
            echo "목록 변경 없음"
          else
            git commit -m "수집 대상 반영 (이슈 #${{ github.event.issue.number }})"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: 자료 수집 실행
        if: steps.apply.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect.yml --ref "${GITHUB_REF_NAME}"
      - name: 결과 댓글 남기고 이슈 닫기
        if: always() && steps.apply.outputs.result_file != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body-file "${{ steps.apply.outputs.result_file }}"
          gh issue close ${{ github.event.issue.number }}
